services:
  - type: web
    name: elms
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS_RAW
        value: ""
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALGORITHM
        value: HS256
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
      - key: ALLOWED_UPLOAD_EXTENSIONS
        value: pdf,doc,docx,ppt,pptx,xls,xlsx,txt,zip,png,jpg,jpeg
      - key: MAX_STUDENT_MESSAGES_PER_DAY
        value: "50"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: elms-db
    plan: free
    databaseName: elms_db
    user: elms_user
